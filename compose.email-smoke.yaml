services:
  api:
    environment:
      Email__Habilitado: "true"
      Email__Worker__Habilitado: "true"
      Email__Worker__IntervaloSegundos: "2"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__Remetente: indicaa2@example.invalid
      Email__UsarTls: "false"
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27.8
    networks: [private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
